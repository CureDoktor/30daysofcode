<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Day 11 - Box Shadow Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="topbar card">
      <div>
        <p class="day-tag">Day 11/30</p>
        <h1>Box Shadow Generator</h1>
        <p class="handle">@curedoktore</p>
      </div>

      <div class="x-mark" aria-label="X motif">
        <img src="../x-logo.jpg" alt="X logo" />
      </div>
    </header>

    <section class="layout">
      <aside class="panel card">
        <p class="panel-kicker">Controls</p>

        <label class="field">
          Horizontal offset
          <input id="offset-x" type="range" min="-80" max="80" value="16" />
          <span id="offset-x-value">16px</span>
        </label>

        <label class="field">
          Vertical offset
          <input id="offset-y" type="range" min="-80" max="80" value="16" />
          <span id="offset-y-value">16px</span>
        </label>

        <label class="field">
          Blur radius
          <input id="blur" type="range" min="0" max="120" value="32" />
          <span id="blur-value">32px</span>
        </label>

        <label class="field">
          Spread radius
          <input id="spread" type="range" min="-40" max="40" value="0" />
          <span id="spread-value">0px</span>
        </label>

        <label class="field">
          Opacity
          <input id="opacity" type="range" min="0" max="1" step="0.01" value="0.28" />
          <span id="opacity-value">0.28</span>
        </label>

        <label class="field check">
          <input id="inset" type="checkbox" />
          Inset shadow
        </label>

        <div class="colors">
          <label class="color-field">Shadow color <input id="shadow-color" type="color" value="#111827" /></label>
          <label class="color-field">Box color <input id="box-color" type="color" value="#ffffff" /></label>
        </div>

        <div class="actions">
          <button class="btn" id="preset-soft">Soft</button>
          <button class="btn" id="preset-hard">Hard</button>
          <button class="btn" id="preset-floating">Floating</button>
          <button class="btn" id="random-btn">Random</button>
        </div>
      </aside>

      <section class="preview-wrap card">
        <p class="panel-kicker">Preview</p>
        <div class="preview" id="preview">
          <div class="shadow-box" id="shadow-box">
            <span>Shadow</span>
          </div>
        </div>

        <div class="code-box">
          <code id="css-output"></code>
          <button class="btn copy-btn" id="copy-btn">Copy CSS</button>
        </div>
      </section>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
