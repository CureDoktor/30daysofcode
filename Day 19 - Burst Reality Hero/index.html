<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Day 19 - Human x AI Reveal Hero</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="navbar">
    <p class="brand">NeuroVision</p>
    <nav>
      <a href="#">Platform</a>
      <a href="#">Research</a>
      <a href="#">Pricing</a>
    </nav>
    <button class="nav-btn">Start AI Trial</button>
  </header>

  <main class="hero">
    <section class="hero-copy">
      <p class="kicker">Next-gen AI assistant</p>
      <h1>From Human Insight to Machine Precision</h1>
      <p>
        Hover over the face. Reality shifts and the AI layer appears beneath the human surface.
      </p>
    </section>

    <section class="face-stage" id="face-stage" aria-label="Human and robot reveal">
      <img
        class="face face-human"
        src="human.png"
        alt="Human face"
      />
      <img
        class="face face-robot"
        id="face-robot"
        src="https://images.unsplash.com/photo-1737644467636-6b0053476bb2?q=80&w=1072&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
        alt="Robot face reveal"
      />
      <div class="hack-ring" id="hack-ring" aria-hidden="true"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
